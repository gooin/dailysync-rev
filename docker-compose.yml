services:
  daily-sync:
    image: 'daily-sync:latest'
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./db:/app/db
    container_name: daily-sync
    # 每次容器启动执行的功能（默认国区同步到国际区），可选：
    #   yarn sync_cn                     同步：国区 → 国际区（默认）
    #   yarn sync_global                 同步：国际区 → 国区
    #   yarn migrate_garmin_cn_to_global 迁移历史数据：国区 → 国际区
    #   yarn migrate_garmin_global_to_cn 迁移历史数据：国际区 → 国区
    command: yarn sync_cn
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  export-garmin-sessions:
    image: 'daily-sync:latest'
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./db:/app/db
    profiles:
      - tools
    command: yarn export_garmin_sessions
